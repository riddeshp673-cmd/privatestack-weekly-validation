<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivateStack Weekly - Validation Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e8e8e8;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .stat-value { font-size: 2rem; font-weight: 700; color: #4ade80; }
        .stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
        .signups-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .signups-table th,
        .signups-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        .signups-table th {
            background: #141414;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
        }
        .signups-table td { font-size: 0.875rem; }
        .signups-table tr:last-child td { border-bottom: none; }
        .signups-table tr:hover { background: #222; }
        .email { font-family: monospace; color: #4ade80; }
        .timestamp { color: #aaa; font-size: 0.8rem; }
        .source { color: #666; font-size: 0.75rem; }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
        .refresh-btn {
            background: #4ade80;
            color: #0f0f0f;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .refresh-btn:hover { background: #22c55e; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .auto-refresh { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #888; }
        .auto-refresh input { accent-color: #4ade80; }
        .error { color: #f87171; font-size: 0.875rem; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <div>
                <h1>🔒 PrivateStack Weekly</h1>
                <p class="subtitle">Validation Dashboard — Real-time signup monitoring</p>
            </div>
            <div class="auto-refresh">
                <label><input type="checkbox" id="autoRefresh" checked> Auto-refresh (30s)</label>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalSignups">—</div>
                <div class="stat-label">Total Signups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lastSignup">—</div>
                <div class="stat-label">Latest Signup</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate">—</div>
                <div class="stat-label">Success Rate</div>
            </div>
        </div>
        
        <table class="signups-table" id="signupsTable">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Timestamp (UTC)</th>
                    <th>Source</th>
                </tr>
            </thead>
            <tbody id="signupsBody">
                <tr><td colspan="3" class="empty-state">Loading...</td></tr>
            </tbody>
        </table>
        
        <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <button class="refresh-btn" id="refreshBtn" onclick="loadDashboard()">🔄 Refresh Now</button>
            <div style="font-size: 0.75rem; color: #666;">Last updated: <span id="lastUpdated">—</span></div>
        </div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        const API_URL = 'https://privatestack-weekly-validation.vercel.app/api/dashboard';
        let autoRefreshInterval = null;
        
        async function loadDashboard() {
            const btn = document.getElementById('refreshBtn');
            const errorDiv = document.getElementById('error');
            btn.disabled = true;
            btn.textContent = 'Loading...';
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                renderDashboard(data);
                document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
            } catch (err) {
                errorDiv.textContent = 'Error loading dashboard: ' + err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Refresh Now';
            }
        }
        
        function renderDashboard(data) {
            document.getElementById('totalSignups').textContent = data.total_signups || 0;
            
            if (data.signups && data.signups.length > 0) {
                const latest = data.signups[0];
                document.getElementById('lastSignup').textContent = formatTime(latest.data.timestamp);
                
                const tbody = document.getElementById('signupsBody');
                tbody.innerHTML = data.signups.map(s => `
                    <tr>
                        <td><span class="email">${escapeHtml(s.data.email || 'N/A')}</span></td>
                        <td><span class="timestamp">${formatTime(s.data.timestamp)}</span></td>
                        <td><span class="source">${escapeHtml(s.data.source || 'landing_page')}</span></td>
                    </tr>
                `).join('');
            } else {
                document.getElementById('lastSignup').textContent = 'None yet';
                document.getElementById('signupsBody').innerHTML = `
                    <tr><td colspan="3" class="empty-state">No signups yet. Share the landing page!</td></tr>
                `;
            }
        }
        
        function formatTime(isoString) {
            if (!isoString) return '—';
            try {
                const date = new Date(isoString);
                return date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZoneName: 'short'
                });
            } catch { return isoString; }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Auto-refresh
        document.getElementById('autoRefresh').addEventListener('change', (e) => {
            if (e.target.checked) {
                autoRefreshInterval = setInterval(loadDashboard, 30000);
            } else {
                clearInterval(autoRefreshInterval);
            }
        });
        
        // Initial load
        loadDashboard();
        autoRefreshInterval = setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
